fixes:
  - cve: CVE-2026-69192
    upstream_fix_url: https://github.com/beaugunderson/ip-address/commit/56368cb3d66c73ba0ee9b6b834fd31b22c2fd71e
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-69192
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-ip-address/compare/934acff~1...bca7a1a
    basis: backport
    artifacts:
      - ip-address
    note: "Carried from 10.2.3-backpatch-00001; upstream's fix in 10.3.1. It closes the advisory: ip-address: Address4 decodes leading-zero octets as decimal while resolvers decode them as octal, allowing SSRF and trust-boundary bypass."
  - cve: CVE-2026-101910
    upstream_fix_url: https://github.com/beaugunderson/ip-address/commit/ab3dc88bcf5374344168a2ba075ca7ac4ff257f8
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-101910
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-ip-address/compare/44b947f~1...90e1caf
    basis: backport
    artifacts:
      - ip-address
    note: "Carried from 10.2.3-backpatch-00002; upstream's fix in 10.5.1. It closes the advisory: ip-address: no classifier recognizes the NAT64 local-use range 64:ff9b:1::/48, allowing SSRF and trust-boundary bypass."
  - cve: CVE-2026-101911
    upstream_fix_url: https://github.com/beaugunderson/ip-address/commit/469ead1231b4cc059f2150c626e1e0c2895c0134
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-101911
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-ip-address/compare/99e3010~1...ea16f83
    basis: backport
    artifacts:
      - ip-address
    note: "Carried from 10.2.3-backpatch-00003; upstream's fix in 10.7.1. It closes the advisory: ip-address: Address6 builds a parse diagnostic proportional to the input with no length bound, allowing a single long string to stall or crash the process."
  - cve: CVE-2026-101912
    upstream_fix_url: https://github.com/beaugunderson/ip-address/commit/1343629d57fea413644a5c9d41ff1e59619f3f28
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-101912
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-ip-address/compare/673b0ae~1...6b694e7
    basis: adapted
    artifacts:
      - ip-address
    note: "Carried from 10.2.3-backpatch-00004; upstream's fix in 10.7.1, adapted to 10.2.2. It closes the advisory: ip-address: isInSubnet() and isHostInSubnet() compare addresses of different families as if they shared an address space, allowing an allowlist check to admit an address outside its range."
  - cve: CVE-2026-101913
    upstream_fix_url: https://github.com/beaugunderson/ip-address/commit/d03e960c7cc3179ef25c8a44b4f94dd499625546
    advisory_url: https://nvd.nist.gov/vuln/detail/CVE-2026-101913
    patch_commit_url: https://github.com/moderne-backpatch-alliance/backpatch-ip-address/compare/16cb38e~1...749b780
    basis: backport
    artifacts:
      - ip-address
    note: "New in this release; upstream's fix in 10.5.1. It closes the advisory: ip-address: Address6.isLinkLocal() recognizes fe80::/64 rather than fe80::/10, allowing SSRF and trust-boundary bypass to on-link hosts."
